<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f8f4;--card:#fff;--text:#24312b;--muted:#5f6f66;--accent:#3d7a5f;--accent2:#e4f0e9;--line:#dbe4dd;--irr:#b4691f;--irr-bg:#fbefe0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c19;--card:#1f2723;--text:#e6eee9;--muted:#9fb0a6;--accent:#7cc4a0;--accent2:#25352d;--line:#33423a;--irr:#e7a560;--irr-bg:#3a2e20}}
:root[data-theme="dark"]{--bg:#161c19;--card:#1f2723;--text:#e6eee9;--muted:#9fb0a6;--accent:#7cc4a0;--accent2:#25352d;--line:#33423a;--irr:#e7a560;--irr-bg:#3a2e20}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:.2em 0}
.sub{color:var(--muted);margin:0 0 14px}
.lang button,.chips button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;font:inherit;cursor:pointer}
.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0}
.lang button.on,.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chips button{border-radius:999px}
input{width:100%;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
input:focus,button:focus-visible{outline:3px solid var(--accent2);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.vc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;color:var(--text);font:inherit}
.vc:hover{border-color:var(--accent)}.vc b{font-size:1.1rem}.vc small{display:block;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);margin-left:6px}
.tag.irr{background:var(--irr-bg);color:var(--irr)}
.back{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:8px 0}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.f{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.f span{display:block;font-size:.78rem;color:var(--muted)}.f b{font-size:1.15rem}
.t{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.t h3{margin:0;font-size:.95rem;color:var(--accent)}.t p{margin:2px 0 0}.t em{color:var(--muted);font-size:.8rem;font-style:normal}
.note{background:var(--accent2);border-radius:10px;padding:10px 14px;margin:10px 0}.t.w p{color:var(--muted)}
.empty{color:var(--muted);padding:20px 0}
</style>
</head>
